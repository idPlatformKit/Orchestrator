# OpenBao chart values for the shared, local-dev-only OpenBao server that
# provider-vault manages per-tenant Namespaces/Mounts/Policies against.
# OpenBao (not Vault) because it ships real Namespaces -- genuine per-tenant
# isolation -- free in its community edition; Vault gates that behind
# Enterprise.
# Not for production use: dev mode (in-memory, auto-unsealed, fixed root
# token), single replica, no sidecar injector.
injector:
  enabled: false

server:
  dev:
    enabled: true
    devRootToken: root-local-dev
  # Sign-in through Dex (platform/openbao-sso/): OpenBao fetches Dex's
  # discovery document at https://dex.127.0.0.1.nip.io and must trust the
  # local CA. The idpk-local-ca ConfigMap (public certificate only) is created
  # by `make local-ca-secret`.
  extraEnvironmentVars:
    SSL_CERT_FILE: /etc/idpk/ca.crt
  volumes:
    - name: idpk-local-ca
      configMap:
        name: idpk-local-ca
  volumeMounts:
    - name: idpk-local-ca
      mountPath: /etc/idpk
      readOnly: true
