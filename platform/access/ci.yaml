# GitHub Actions workflows of the installation's org, signed in with their
# job's OIDC token (local/authentication-config.yaml): the same read-only
# view as the portal and the agents. Grant more per need, never cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: github-actions
