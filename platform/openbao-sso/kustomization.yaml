# Sign-in to OpenBao through Dex, in its root namespace. Managed with
# provider-vault, like the tenants' OpenBao resources. Needs provider-vault
# (providers/), Dex (platform/dex/) and the openbao-oidc Secret created by
# `make dex-secret`. Each Tenant adds its own role (compositions/tenant/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - auth-backend.yaml
  - platform-admins.yaml
