# In prod, every image is pinned by digest: what runs is exactly what was
# tested in staging and promoted, not whatever a tag points to today
# (docs/environments.md). Autogen applies it to the workloads' pod templates.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: prod-images-by-digest
  annotations:
    policies.kyverno.io/title: Images pinned by digest in prod
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        platform.idplatformkit.io/environment: prod
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: variables.containers.all(c, c.image.contains('@sha256:'))
      messageExpression: >-
        'In prod, images are pinned by digest (image@sha256:...), the one promoted from staging (not pinned: ' +
        variables.containers.filter(c, !c.image.contains('@sha256:')).map(c, c.name).join(', ') + ')'
