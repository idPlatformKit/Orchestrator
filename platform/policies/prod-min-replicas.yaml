# In prod, Deployments and StatefulSets run at least 2 replicas, so that a
# node drain or a rollout never takes the app down. Scaling through the
# scale subresource (kubectl scale, an autoscaler) isn't checked. An unset
# spec.replicas is already 1 here: the API server defaults it before
# admission webhooks run.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: prod-min-replicas
  annotations:
    policies.kyverno.io/title: At least 2 replicas in prod
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
    namespaceSelector:
      matchLabels:
        platform.idplatformkit.io/environment: prod
  validations:
    - expression: object.spec.replicas >= 2
      messageExpression: >-
        'In prod, ' + object.kind + 's run at least 2 replicas (spec.replicas: ' +
        string(object.spec.replicas) + ')'
