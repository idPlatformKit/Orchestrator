# Bitnami "postgresql" chart values for the shared, local-dev-only Postgres
# server that provider-sql manages logical databases/roles against.
# Not for production use: single replica, default/ephemeral storage.
architecture: standalone

primary:
  persistence:
    enabled: false

# Admin password comes from a Secret created by `make postgres-bootstrap-secrets`
# (dev default), so it never sits in Git or in an Argo CD Application spec.
auth:
  existingSecret: postgres-server-auth
