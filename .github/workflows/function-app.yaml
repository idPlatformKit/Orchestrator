name: function-app

# The App composition function (functions/app): tests on every change, and a
# Crossplane package for amd64 and arm64 (kind on Apple silicon runs arm64).
# Every push publishes ghcr.io/idplatformkit/function-app:sha-<commit>, so a
# branch can be tested on kind before it's merged (docs/compositions/app.md);
# pushes to main also publish :main. Pull requests only build.

on:
  push:
    paths:
      - functions/app/**
      - .github/workflows/function-app.yaml
  pull_request:
    paths:
      - functions/app/**
      - .github/workflows/function-app.yaml
  workflow_dispatch:

env:
  PACKAGE: ghcr.io/idplatformkit/function-app
  CROSSPLANE_VERSION: v2.4.0

defaults:
  run:
    working-directory: functions/app

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/app/go.mod
          cache-dependency-path: functions/app/go.sum

      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -v -cover ./...

  package:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install the Crossplane CLI
        run: |
          curl -sSfL -o /usr/local/bin/crossplane \
            "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x /usr/local/bin/crossplane

      # Go cross-compiles, and the runtime stage only copies the binary: no
      # emulation needed for arm64.
      - name: Build the runtime images and the packages
        run: |
          go_version=$(sed -n 's/^go //p' go.mod)
          for arch in amd64 arm64; do
            docker buildx build . --platform "linux/$arch" --target image \
              --build-arg "GO_VERSION=$go_version" \
              --output "type=docker,dest=runtime-$arch.tar"
            crossplane xpkg build --package-root=package \
              --embed-runtime-image-tarball="runtime-$arch.tar" \
              --package-file="function-app-$arch.xpkg"
          done

      - uses: docker/login-action@v3
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags main"; fi
          for tag in $tags; do
            crossplane xpkg push --package-files function-app-amd64.xpkg,function-app-arm64.xpkg "$PACKAGE:$tag"
            echo "published $PACKAGE:$tag"
          done
