name: hello-image

# The hello demo app (examples/app/hello), the image `make try-app` deploys
# to staging then prod, by digest. Pull requests only build; pushes publish
# ghcr.io/idplatformkit/hello:sha-<commit> for amd64 and arm64 (kind on
# Apple silicon runs arm64). Go cross-compiles: no emulation.

on:
  push:
    paths:
      - examples/app/hello/**
      - .github/workflows/hello-image.yaml
  pull_request:
    paths:
      - examples/app/hello/**
      - .github/workflows/hello-image.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/idplatformkit/hello

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build, and publish on push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: examples/app/hello
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Digest
        if: github.event_name != 'pull_request'
        run: echo "$IMAGE@${{ steps.build.outputs.digest }}"
