apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresdatabase-incluster
spec:
  compositeTypeRef:
    apiVersion: database.idplatformkit.io/v1alpha1
    kind: PostgresDatabase
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        writeConnectionSecretToRef:
          patches:
            - type: FromCompositeFieldPath
              fromFieldPath: spec.writeConnectionSecretToRef.name
              toFieldPath: name
        resources:
          # The role's password, generated once in the namespace by External
          # Secrets Operator: nobody sees or sets it. An explicit password
          # (passwordSecretRef) rather than provider-sql's own: provider-sql
          # sets the role's password again whenever it differs from the one
          # it published, so a retained role adopted again by a re-created
          # PostgresDatabase gets working credentials. With a generated one,
          # the adopted role's first update rotated the password, then
          # failed before publishing it, and never rotated it again: the
          # connection Secret had no password (docs/compositions/app.md).
          - name: password-generator
            base:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              spec:
                # Letters and digits only: safe in a connection URL.
                length: 32
                digits: 8
                symbols: 0
                allowRepeat: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
            # A generator has no status.
            readinessChecks:
              - type: None
          - name: password
            base:
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              spec:
                refreshPolicy: CreatedOnce
                target:
                  creationPolicy: Owner
                dataFrom:
                  - sourceRef:
                      generatorRef:
                        apiVersion: generators.external-secrets.io/v1alpha1
                        kind: Password
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.dataFrom[0].sourceRef.generatorRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"

          # The role reads its password to connect, deletion included: the
          # ExternalSecret, and the Secret it owns, must outlive it. Without
          # this, they were deleted first, and the role stayed stuck on
          # "cannot get password secret". Crossplane refuses to delete the
          # ExternalSecret while the role exists.
          - name: password-usage
            base:
              apiVersion: protection.crossplane.io/v1beta1
              kind: Usage
              spec:
                replayDeletion: true
                of:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  resourceRef: {}
                by:
                  apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
                  kind: Role
                  resourceRef: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.of.resourceRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.by.resourceRef.name

          # The app role, with the password above. provider-sql writes the
          # connection details to writeConnectionSecretToRef.
          - name: role
            base:
              apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
              kind: Role
              spec:
                forProvider:
                  privileges:
                    login: true
                  passwordSecretRef:
                    key: password
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: postgres-local
            patches:
              # Retain (the default) leaves out Delete: deleting this object,
              # its PostgresDatabase or its namespace leaves the database in
              # Postgres, without connecting to it (no #14 hang), and
              # re-creating it under the same name adopts it again.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.deletionPolicy
                toFieldPath: spec.managementPolicies
                transforms:
                  - type: map
                    map:
                      Retain: [Observe, Create, Update, LateInitialize]
                      Delete: ["*"]
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              # Server-side name: <namespace>_<name>. All tenants share one
              # Postgres server, so the XR name alone collided across
              # namespaces: a PostgresDatabase with the same name in another
              # namespace adopted the existing role and database, and deleting
              # it dropped them (#21). "_" can't appear in Kubernetes names,
              # so two (namespace, name) pairs never produce the same name.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "%s_%s"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              # Lets the portal select this database's objects across the
              # cluster (crossplane.io/composite=<name>,
              # idplatformkit.io/tenant=<namespace>): the name alone is only
              # unique within a namespace.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.labels[idplatformkit.io/tenant]
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-role"
            connectionDetails:
              - name: username
                type: FromConnectionSecretKey
                fromConnectionSecretKey: username
              - name: password
                type: FromConnectionSecretKey
                fromConnectionSecretKey: password

          # The logical database, owned by the role above so it gets full
          # rights on everything it creates without a separate Grant.
          - name: database
            base:
              apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
              kind: Database
              spec:
                forProvider: {}
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: postgres-local
            patches:
              # Retain (the default) leaves out Delete: deleting this object,
              # its PostgresDatabase or its namespace leaves the database in
              # Postgres, without connecting to it (no #14 hang), and
              # re-creating it under the same name adopts it again.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.deletionPolicy
                toFieldPath: spec.managementPolicies
                transforms:
                  - type: map
                    map:
                      Retain: [Observe, Create, Update, LateInitialize]
                      Delete: ["*"]
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              # Same <namespace>_<name> as the role, which owns the database.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "%s_%s"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              # Lets the portal select this database's objects across the
              # cluster (crossplane.io/composite=<name>,
              # idplatformkit.io/tenant=<namespace>): the name alone is only
              # unique within a namespace.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.labels[idplatformkit.io/tenant]
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "%s_%s"
                toFieldPath: spec.forProvider.owner
              # What the database's object actually allows, for callers that
              # wait for Delete before deleting it (the App function).
              - type: ToCompositeFieldPath
                fromFieldPath: spec.managementPolicies
                toFieldPath: status.databaseManagementPolicies
            connectionDetails:
              - name: dbname
                type: FromFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
              - name: host
                type: FromValue
                value: postgres-server-postgresql.postgres-system.svc.cluster.local
              - name: port
                type: FromValue
                value: "5432"
    - step: ready
      functionRef:
        name: function-auto-ready
