apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresdatabases.database.idplatformkit.io
spec:
  group: database.idplatformkit.io
  scope: Namespaced
  names:
    kind: PostgresDatabase
    plural: postgresdatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                writeConnectionSecretToRef:
                  type: object
                  description: >-
                    Name of the Secret (in this namespace) to write the
                    database connection details (host, port, dbname,
                    username, password) to.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                deletionPolicy:
                  type: string
                  description: >-
                    What happens to the database in Postgres when this
                    object is deleted, by itself or with its namespace.
                    Retain (the default) keeps it, with its data and its
                    role: re-creating a PostgresDatabase with the same name
                    in the same namespace adopts it again. Delete drops it.
                  enum: [Retain, Delete]
                  default: Retain
              required:
                - writeConnectionSecretToRef
            status:
              type: object
              properties:
                databaseManagementPolicies:
                  type: array
                  description: >-
                    The management policies of the database's object: Delete
                    has reached it when this is ["*"].
                  items:
                    type: string
