apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tenants.platform.idplatformkit.io
spec:
  group: platform.idplatformkit.io
  scope: Cluster
  names:
    kind: Tenant
    plural: tenants
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ownerGroup:
                  type: string
                  description: >-
                    The team that owns the tenant: `edit` in its staging
                    namespace, `view` in its prod namespace, and read/write
                    on its OpenBao secrets.
                environments:
                  type: array
                  description: >-
                    The environments the tenant runs in, among the
                    platform's. Each one is a namespace named
                    `<tenant>-<environment>` with its own rules: see
                    docs/environments.md.
                  items:
                    type: string
                    enum: [staging, prod]
                  minItems: 1
                  maxItems: 2
                  x-kubernetes-list-type: set
                  default: [staging, prod]
                vault:
                  type: object
                  description: >-
                    Optional OpenBao secrets space for this tenant: one
                    OpenBao namespace, with a KV mount per environment.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    serviceAccountName:
                      type: string
                      description: >-
                        The ServiceAccount, created by this composition in
                        each environment's namespace, allowed to read that
                        environment's secrets. Used by the environment's
                        External Secrets Operator SecretStore.
                  required:
                    - serviceAccountName
              required:
                - ownerGroup
