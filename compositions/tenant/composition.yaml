apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-incluster
spec:
  compositeTypeRef:
    apiVersion: platform.idplatformkit.io/v1alpha1
    kind: Tenant
  mode: Pipeline
  pipeline:
    # One set of resources per environment, so a template rather than
    # patch-and-transform, which can't loop over spec.environments.
    - step: compose
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $tenant := $xr.metadata.name }}
            {{- $owner := $xr.spec.ownerGroup }}
            {{- $vault := and $xr.spec.vault $xr.spec.vault.enabled }}
            {{- /* Composed resources that already exist, by name. */}}
            {{- $observed := .observed.resources | default dict }}
            {{- /*
              What each environment changes (docs/environments.md):
              - pss: the Pod Security Standard Pod Security Admission
                enforces on the namespace;
              - role: what the owner team gets in the namespace. In prod
                everything goes through GitOps: read-only, and break-glass
                to intervene.
            */}}
            {{- $rules := dict
                  "staging" (dict "pss" "baseline" "role" "edit")
                  "prod" (dict "pss" "restricted" "role" "view") }}

            {{- range $env := $xr.spec.environments }}
            {{- $ns := printf "%s-%s" $tenant $env }}
            {{- $rule := get $rules $env }}
            ---
            apiVersion: v1
            kind: Namespace
            metadata:
              name: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "namespace-%s" $env) }}
                # Plain native resources have no Ready condition to wait on:
                # ready once they exist. Not before: the sequencer below
                # would let what lives in the namespace go first.
                {{- if hasKey $observed (printf "namespace-%s" $env) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                # Pod Security Admission (built into Kubernetes) refuses pods
                # below this Pod Security Standard.
                pod-security.kubernetes.io/enforce: {{ get $rule "pss" }}
                # Warnings against "restricted" everywhere: Pod Security
                # Admission only enforces on pods, so this is what tells a
                # Deployment's author, at apply time, that its pods won't
                # start in prod.
                pod-security.kubernetes.io/warn: restricted
                # What the guardrails (platform/policies/) select on, and the
                # team every workload is labelled with.
                platform.idplatformkit.io/tenant: {{ $tenant }}
                platform.idplatformkit.io/environment: {{ $env }}
                platform.idplatformkit.io/owner: {{ $owner }}
            ---
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: {{ $tenant }}
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "resourcequota-%s" $env) }}
                {{- if hasKey $observed (printf "resourcequota-%s" $env) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              hard:
                requests.cpu: "4"
                requests.memory: 8Gi
                limits.cpu: "8"
                limits.memory: 16Gi
                pods: "20"
            ---
            apiVersion: v1
            kind: LimitRange
            metadata:
              name: {{ $tenant }}
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "limitrange-%s" $env) }}
                {{- if hasKey $observed (printf "limitrange-%s" $env) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              limits:
                - type: Container
                  default:
                    cpu: 500m
                    memory: 512Mi
                  defaultRequest:
                    cpu: 100m
                    memory: 128Mi
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ $tenant }}
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "rolebinding-%s" $env) }}
                {{- if hasKey $observed (printf "rolebinding-%s" $env) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: {{ get $rule "role" }}
            subjects:
              - apiGroup: rbac.authorization.k8s.io
                kind: Group
                name: {{ $owner }}
            ---
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: {{ $tenant }}
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "networkpolicy-%s" $env) }}
                {{- if hasKey $observed (printf "networkpolicy-%s" $env) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              podSelector: {}
              policyTypes:
                - Ingress
              ingress:
                # Only from other pods of the same namespace: staging can't
                # reach prod, nor another tenant.
                - from:
                    - podSelector: {}
            {{- end }}

            {{- if $vault }}
            {{- $sa := $xr.spec.vault.serviceAccountName }}
            {{- /*
              OpenBao: a real OpenBao namespace per tenant (Vault gates
              namespaces behind Enterprise), with one KV v2 mount per
              environment. Every OpenBao object is a managed resource kept
              in the idpk-tenants namespace, out of the teams' reach.

              Each one gets its external name up front, the same the
              provider would record (the OpenBao path or name). Without it,
              provider-vault once in a while created a Mount and failed to
              record its external name; the next reconcile created it again,
              and OpenBao answered "path is already in use" forever (#16).
              With it, the provider observes and adopts what exists.
            */}}
            ---
            apiVersion: vault.vault.m.upbound.io/v1alpha1
            kind: VaultNamespace
            metadata:
              name: {{ $tenant }}
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation "vault-namespace" }}
                crossplane.io/external-name: "{{ $tenant }}/"
            spec:
              forProvider:
                path: {{ $tenant }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            {{- /*
              The Kubernetes auth method, inside the tenant's OpenBao
              namespace. managementPolicies excludes Delete on everything
              inside that namespace: deleting the VaultNamespace already
              wipes its content, and a child deleting itself afterwards gets
              a 404 the provider retries forever (docs/compositions/tenant.md).
            */}}
            ---
            apiVersion: auth.vault.m.upbound.io/v1alpha1
            kind: Backend
            metadata:
              name: {{ $tenant }}
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation "vault-k8s-auth-backend" }}
                crossplane.io/external-name: "kubernetes"
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                type: kubernetes
                path: kubernetes
                namespace: {{ $tenant }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            ---
            apiVersion: kubernetes.vault.m.upbound.io/v1alpha1
            kind: AuthBackendConfig
            metadata:
              name: {{ $tenant }}
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation "vault-k8s-auth-config" }}
                crossplane.io/external-name: "auth/kubernetes/config"
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                backend: kubernetes
                kubernetesHost: https://kubernetes.default.svc
                namespace: {{ $tenant }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local

            {{- range $env := $xr.spec.environments }}
            {{- $ns := printf "%s-%s" $tenant $env }}
            {{- /* The environment's secrets: a mount, a policy on it, and a
                   Kubernetes auth role bound to one ServiceAccount of the
                   environment's namespace. Staging can't read prod. */}}
            ---
            apiVersion: vault.vault.m.upbound.io/v1alpha1
            kind: Mount
            metadata:
              name: {{ $ns }}
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation (printf "vault-mount-%s" $env) }}
                crossplane.io/external-name: "{{ $env }}"
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                namespace: {{ $tenant }}
                path: {{ $env }}
                type: kv-v2
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            ---
            apiVersion: vault.vault.m.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $ns }}
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation (printf "vault-policy-%s" $env) }}
                crossplane.io/external-name: "{{ $env }}"
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                namespace: {{ $tenant }}
                name: {{ $env }}
                policy: |
                  path "{{ $env }}/data/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  path "{{ $env }}/metadata/*" {
                    capabilities = ["list", "read", "delete"]
                  }
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            ---
            apiVersion: kubernetes.vault.m.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              name: {{ $ns }}
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation (printf "vault-k8s-role-%s" $env) }}
                crossplane.io/external-name: "auth/kubernetes/role/{{ $env }}"
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                backend: kubernetes
                roleName: {{ $env }}
                tokenPolicies:
                  - {{ $env }}
                tokenTtl: 3600
                boundServiceAccountNames:
                  - {{ $sa }}
                boundServiceAccountNamespaces:
                  - {{ $ns }}
                namespace: {{ $tenant }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: {{ $sa }}
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "vault-serviceaccount-%s" $env) }}
                {{- if hasKey $observed (printf "vault-serviceaccount-%s" $env) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            {{- /* Teams declare ExternalSecrets against this store to get
                   the environment's secrets as Kubernetes Secrets. ESO
                   validates it against OpenBao and reports Ready. */}}
            ---
            apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: openbao
              namespace: {{ $ns }}
              annotations:
                {{ setResourceNameAnnotation (printf "vault-secretstore-%s" $env) }}
            spec:
              provider:
                vault:
                  server: http://openbao.openbao-system.svc.cluster.local:8200
                  namespace: {{ $tenant }}
                  path: {{ $env }}
                  version: v2
                  auth:
                    kubernetes:
                      mountPath: kubernetes
                      role: {{ $env }}
                      serviceAccountRef:
                        name: {{ $sa }}
            {{- end }}

            {{- /*
              People: the owner team reads and writes the secrets of every
              environment in OpenBao's UI or CLI, signed in with GitHub through
              Dex (the oidc auth method, platform/openbao-sso/), with the role
              tenant-<name>. Both objects live in OpenBao's root namespace,
              where that auth method is: the policy reaches the tenant's
              namespace through its path prefix (<name>/<env>/...), and
              nothing else. Secrets aren't in Git, so the team writes prod's
              too.
            */}}
            ---
            apiVersion: vault.vault.m.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $tenant }}-team
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation "vault-oidc-policy" }}
                crossplane.io/external-name: "tenant-{{ $tenant }}"
            spec:
              forProvider:
                name: tenant-{{ $tenant }}
                policy: |
                  {{- range $env := $xr.spec.environments }}
                  path "{{ $tenant }}/{{ $env }}/*" {
                    capabilities = ["create", "read", "update", "patch", "delete", "list"]
                  }
                  {{- end }}
                  # The UI lists the namespace's mounts to show them.
                  path "{{ $tenant }}/sys/internal/ui/mounts" {
                    capabilities = ["read"]
                  }
                  path "{{ $tenant }}/sys/internal/ui/mounts/*" {
                    capabilities = ["read"]
                  }
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            {{- /* Dex sends teams as "<org>:<team>", only for the
                   installation's org: the glob matches the owner team
                   without naming the org, like the RoleBindings. */}}
            ---
            apiVersion: jwt.vault.m.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              name: {{ $tenant }}-team
              namespace: idpk-tenants
              annotations:
                {{ setResourceNameAnnotation "vault-oidc-role" }}
                crossplane.io/external-name: "auth/oidc/role/tenant-{{ $tenant }}"
            spec:
              forProvider:
                backend: oidc
                roleName: tenant-{{ $tenant }}
                roleType: oidc
                userClaim: preferred_username
                groupsClaim: groups
                oidcScopes: [profile, email, groups]
                boundClaimsType: glob
                boundClaims:
                  groups: "*:{{ $owner }}"
                allowedRedirectUris:
                  - https://openbao.127.0.0.1.nip.io/ui/vault/auth/oidc/oidc/callback
                  - http://localhost:8250/oidc/callback
                tokenPolicies:
                  - tenant-{{ $tenant }}
                tokenTtl: 3600
              providerConfigRef:
                kind: ClusterProviderConfig
                name: vault-local
            {{- end }}

    # Managed resources (OpenBao) and the SecretStore are ready when their
    # Ready condition says so.
    - step: ready
      functionRef:
        name: function-auto-ready

    # Create resources in dependency order instead of all at once. Without
    # this, every namespaced resource first failed with `namespaces "<ns>" not
    # found` and Crossplane backed off for ~90s; then the OpenBao children
    # failed with OpenBao's own `namespace not found` (404) until the
    # VaultNamespace existed. A Tenant took ~3 minutes to become Ready (see
    # docs/compositions/tenant.md). Last in the pipeline so that
    # resetCompositeReadiness has the final say: the Tenant can't report
    # Ready while some resources are still held back.
    #
    # cacheTTL: the function's response is valid that long, and Crossplane
    # reconciles the Tenant again after it. With the default (1 minute), a
    # Tenant waited for that next pass at every held-back step and took
    # about 60s to become Ready; 64s measured with the previous
    # patch-and-transform composition too. With 5s: 13s. The cost is a
    # reconcile of each Tenant every 5 seconds.
    #
    # One rule per prerequisite, and per environment: a group of
    # alternatives in first position didn't hold resources back. A rule
    # naming an environment the tenant doesn't have holds nothing back,
    # since none of its resources exist.
    - step: sequence
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        resetCompositeReadiness: true
        cacheTTL: 5s
        rules:
          - sequence:
              - namespace-staging
              - (resourcequota|limitrange|rolebinding|networkpolicy|vault-serviceaccount)-staging
          - sequence:
              - namespace-prod
              - (resourcequota|limitrange|rolebinding|networkpolicy|vault-serviceaccount)-prod
          - sequence:
              - vault-namespace
              - (vault-k8s-auth-backend|vault-mount-.*|vault-policy-.*)
          - sequence:
              - vault-k8s-auth-backend
              - (vault-k8s-auth-config|vault-k8s-role-.*)
          # A store can only validate once the role it logs in with, the
          # policy and the mount it reads, and its ServiceAccount exist.
          - sequence:
              - vault-k8s-auth-config
              - vault-secretstore-.*
          - sequence:
              - vault-k8s-role-staging
              - vault-secretstore-staging
          - sequence:
              - vault-policy-staging
              - vault-secretstore-staging
          - sequence:
              - vault-mount-staging
              - vault-secretstore-staging
          - sequence:
              - vault-serviceaccount-staging
              - vault-secretstore-staging
          - sequence:
              - vault-k8s-role-prod
              - vault-secretstore-prod
          - sequence:
              - vault-policy-prod
              - vault-secretstore-prod
          - sequence:
              - vault-mount-prod
              - vault-secretstore-prod
          - sequence:
              - vault-serviceaccount-prod
              - vault-secretstore-prod
          # The team's OIDC role grants the team's policy: policy first.
          - sequence:
              - vault-oidc-policy
              - vault-oidc-role
