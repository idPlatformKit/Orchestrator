# The only object applied by hand (`make gitops-root-apply`). Everything
# else is an Argo CD Application rendered from bootstrap/apps/ -- the
# "app of apps" pattern. repoURL/targetRevision are overridable from the
# Makefile (GITOPS_REPO_URL, GITOPS_REVISION) to test a branch; the
# installation's GitHub org and instances repository come from .idpk.env.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/idPlatformKit/Orchestrator.git
    targetRevision: main
    path: bootstrap/apps
    helm:
      valuesObject:
        repoURL: https://github.com/idPlatformKit/Orchestrator.git
        targetRevision: main
        # The installation, from .idpk.env (`make setup`). Replaced by
        # `make gitops-root-apply`, which refuses to run without them.
        github:
          org: __IDPK_GITHUB_ORG__
          instancesRepo: __IDPK_INSTANCES_REPO__
        portal:
          imageTag: __PORTAL_IMAGE_TAG__
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # A sync wave fails when one of its child apps is Degraded, and a child can
    # be Degraded for a few minutes on a fresh cluster (providers before its
    # ClusterProviderConfig CRDs exist, envoy-gateway while it starts: see
    # docs/gitops.md). Without an explicit retry the root app gave up after 5
    # attempts and never synced the later waves of that revision.
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
