# Wave 2: the claims, from the installation's instances repository. Last, because
# a claim needs its XRD (wave 1) to exist. The retry covers a
# PostgresDatabase whose namespace is created by its Tenant in the same sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: instances
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.instances.repoURL | default (printf "https://github.com/%s/%s.git" (required "github.org is required: run `make setup`" .Values.github.org) .Values.github.instancesRepo) }}
    targetRevision: {{ .Values.instances.targetRevision }}
    path: .
    directory:
      recurse: true
      # .github/: CI. catalog/: Backstage entities describing the tenants,
      # read by the portal, not Kubernetes objects.
      exclude: '{.github/**,catalog/**}'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
