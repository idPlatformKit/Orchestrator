# Wave 2: the claims, from the separate instances repository. Last, because
# a claim needs its XRD (wave 1) to exist. The retry covers a
# PostgresDatabase whose namespace is created by its Tenant in the same sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: instances
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.instances.repoURL }}
    targetRevision: {{ .Values.instances.targetRevision }}
    path: .
    directory:
      recurse: true
      exclude: '.github/**'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
