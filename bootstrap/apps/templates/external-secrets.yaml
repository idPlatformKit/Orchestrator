# Wave -1: External Secrets Operator. Its CRDs must exist before the
# compositions (wave 1) compose SecretStores. Chart from upstream, values
# from platform/external-secrets/values.yaml, as the local flow does.
# ServerSideApply: ESO's CRDs are too large for the last-applied-configuration
# annotation a client-side apply writes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: {{ .Values.charts.externalSecrets | quote }}
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/external-secrets/values.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
