# Wave 0: single sign-on. Dex (chart from upstream, values from
# platform/dex/values.yaml, as the local flow does) needs the platform
# Gateway (wave -1) for its route, and the dex-secrets Secret created by
# `make bootstrap-secrets`. `access` grants cluster-wide roles to teams.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://charts.dexidp.io
      chart: dex
      targetRevision: {{ .Values.charts.dex | quote }}
      helm:
        releaseName: dex
        valueFiles:
          - $values/platform/dex/values.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/access
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 1: OpenBao's OIDC auth method and the platform-admins role
# (platform/openbao-sso/), managed with provider-vault: its CRDs come with the
# providers (wave 0). Each Tenant adds its own role.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-sso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/openbao-sso
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
