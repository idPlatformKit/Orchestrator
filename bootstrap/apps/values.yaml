# Git source the child Applications read providers/, compositions/ and
# platform/*/values.yaml from. Set by the root Application.
repoURL: https://github.com/idPlatformKit/Orchestrator.git
targetRevision: main

# Upstream chart versions, pinned. Keep in sync with the Makefile
# (CROSSPLANE_VERSION, POSTGRES_CHART_VERSION, OPENBAO_CHART_VERSION,
# ESO_CHART_VERSION, CERT_MANAGER_CHART_VERSION, ENVOY_GATEWAY_CHART_VERSION) so both install paths deploy the same thing.
charts:
  crossplane: 2.4.0
  postgresql: 18.12.15
  openbao: 0.30.4
  externalSecrets: 2.14.0
  certManager: v1.21.3
  envoyGateway: v1.9.3

# The installation: the GitHub org whose members use the portal and whose
# teams own tenants, and its instances repository. Set by the root
# Application from .idpk.env (`make setup`); no default on purpose.
github:
  org: ""
  instancesRepo: instances

# Where the claims (Tenant, PostgresDatabase, ...) live. Removing a claim
# there deletes the resource: the instances Application prunes.
# repoURL defaults to https://github.com/<github.org>/<github.instancesRepo>.git;
# set it to sync another repository or a fork.
instances:
  repoURL: ""
  targetRevision: main

# The portal image (ghcr.io/idplatformkit/portal), built by idPlatformKit/portal.
portal:
  imageTag: main
