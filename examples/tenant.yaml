apiVersion: platform.idplatformkit.io/v1alpha1
kind: Tenant
metadata:
  name: demo-team
spec:
  ownerGroup: demo-team-engineers
  vault:
    enabled: true
    # Created by the composition in the demo-team namespace. It's the only
    # ServiceAccount allowed to read the tenant's OpenBao secrets, and the
    # identity the tenant's SecretStore uses.
    serviceAccountName: demo-app
