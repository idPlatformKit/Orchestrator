apiVersion: platform.idplatformkit.io/v1alpha1
kind: Tenant
metadata:
  name: demo-team
spec:
  ownerGroup: demo-team-engineers
  # The namespaces demo-team-staging and demo-team-prod (the default).
  environments: [staging, prod]
  vault:
    enabled: true
    # Created by the composition in each environment's namespace. It's the
    # only ServiceAccount allowed to read that environment's OpenBao
    # secrets, and the identity of the environment's SecretStore.
    serviceAccountName: demo-app
