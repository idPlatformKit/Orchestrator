# Accepted in a tenant namespace. It claims another owner: tenant-owner-label
# overwrites it with the tenant's team.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-compliant
  namespace: demo-team
spec:
  selector:
    matchLabels: {app: guardrails-compliant}
  template:
    metadata:
      labels:
        app: guardrails-compliant
        platform.idplatformkit.io/owner: someone-else
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
