# Accepted in a tenant namespace: it declares its resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-compliant
  namespace: demo-team-staging
spec:
  selector:
    matchLabels: {app: guardrails-compliant}
  template:
    metadata:
      labels: {app: guardrails-compliant}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
