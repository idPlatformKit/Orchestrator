# Pulls the "db-credentials" secret from the demo-team tenant's own OpenBao
# namespace into a Kubernetes Secret, through the "openbao" SecretStore the
# Tenant composes. `make try-tenant` writes the value into OpenBao first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: demo-team
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: db-credentials
  data:
    - secretKey: password
      remoteRef:
        key: db-credentials
        property: password
