# Pulls the "db-credentials" secret from the demo-team tenant's OpenBao
# secrets for staging into a Kubernetes Secret, through the "openbao"
# SecretStore the Tenant composes in demo-team-staging. The same file in
# demo-team-prod reads prod's secrets. `make try-tenant` writes the values
# into OpenBao first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: demo-team-staging
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: db-credentials
  data:
    - secretKey: password
      remoteRef:
        key: db-credentials
        property: password
